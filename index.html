<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  
  <!-- Favicons for all browsers and Google Search -->
  <link rel="icon" type="image/svg+xml" href="/omzetin-logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#F38020" />
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Performance optimization: DNS prefetch and preconnect -->
  <link rel="preconnect" href="https://omzetin.web.id" />
  <link rel="dns-prefetch" href="https://omzetin.web.id" />

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="OMZETIN - Aplikasi kasir dan manajemen warung modern. Kelola stok, transaksi penjualan, dan laporan keuangan warung Anda dengan mudah." />
  <meta name="keywords" content="kasir, warung, point of sale, POS, manajemen stok, aplikasi kasir" />
  <meta name="author" content="OMZETIN" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://omzetin.web.id/" />
  <meta property="og:title" content="OMZETIN - Aplikasi Kasir Warung Modern" />
  <meta property="og:description"
    content="Kelola warung Anda dengan mudah: kasir, stok, dan laporan keuangan dalam satu aplikasi." />

  <title>OMZETIN</title>

  <!-- Inline Critical CSS for instant render (no blank screen) -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #FEFEFE;
      color: #1A1A1A;
    }

    #root {
      min-height: 100vh;
    }

    /* Loading animation */
    .neo-loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .neo-loader-box {
      width: 80px;
      height: 80px;
      background-color: #F38020;
      border: 4px solid #1A1A1A;
      position: relative;
      animation: neoRotate 3s linear infinite, neoBounce 1.2s ease-in-out infinite;
    }

    .neo-loader-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background-color: #FEFEFE;
      border: 3px solid #1A1A1A;
    }

    .neo-loader-text {
      font-family: monospace;
      font-size: 18px;
      font-weight: bold;
      color: #1A1A1A;
      background-color: #F38020;
      padding: 12px 24px;
      border: 3px solid #1A1A1A;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: neoPulse 1.5s ease-in-out infinite;
    }

    @keyframes neoRotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes neoBounce {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-15px) scale(1.1);
      }
    }

    @keyframes neoPulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Neo-brutalism loader - shows instantly before React boots -->
    <div class="neo-loader-container">
      <div class="neo-loader-box">
        <div class="neo-loader-inner"></div>
      </div>
      <div class="neo-loader-text">Loading</div>
    </div>
  </div>
  <script>
    window.addEventListener('error', (event) => {
      const isOurAppError = event.filename && event.filename.startsWith(window.location.origin);
      if (isOurAppError) {
        navigator.sendBeacon('/api/client-errors', JSON.stringify({
          message: event.message,
          url: window.location.href,
          userAgent: navigator.userAgent,
          source: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          stack: event.error ? event.error.stack : null,
          timestamp: new Date().toISOString()
        }));
      }
    }, true);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
